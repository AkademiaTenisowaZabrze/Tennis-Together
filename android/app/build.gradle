apply plugin: 'com.android.application'

// Klucz podpisujący — wczytywany z keystore.properties (lokalnie, gitignored)
// albo wygenerowany przez CI z sekretów GitHub Actions tuż przed buildem.
// Bez niego (np. debug build, albo release build zanim wygenerujemy klucz)
// signingConfig po prostu się nie stosuje — Gradle produkuje wtedy
// NIEPODPISANY release (app-release-unsigned.apk), nie plik o oczekiwanej
// przez CI nazwie app-release.apk. Patrz PLAN.md, sekcja o kluczu.
def keystorePropertiesFile = file('keystore.properties')
def keystoreProperties = new Properties()
def hasSigningConfig = keystorePropertiesFile.exists()
if (hasSigningConfig) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Stały debug.keystore — patrz szerszy komentarz przy signingConfigs.debug
// niżej. Jeśli plik jeszcze nie istnieje (np. pierwszy lokalny build zanim
// CI go wygeneruje), NIE nadpisujemy domyślnego signingConfig Androida —
// bez tego warunku Gradle wywaliłby się na brakującym pliku.
def hasFixedDebugKeystore = file('debug.keystore').exists()

// versionCode MUSI rosnąć z każdym wydaniem, inaczej Android przy instalacji
// "aktualizacji" z tym samym kodem może zignorować nowy APK (patrz notatka
// w projekcie PZT — dokładnie to się tam stało). CI przekazuje
// -PappVersionCode=<numer przebiegu GitHub Actions> (zawsze rosnący);
// lokalny build bez tej flagi dostaje wysoki fallback.
def appVersionCode = project.hasProperty('appVersionCode') ? (project.appVersionCode as Integer) : 90000
def appVersionName = project.hasProperty('appVersionName') ? project.appVersionName : "0.1.${appVersionCode}"

android {
    namespace = "pl.tennistogether.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "pl.tennistogether.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasSigningConfig) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
        debug {
            // Bez tego Gradle używa domyślnego ~/.android/debug.keystore,
            // który na maszynie GitHub Actions jest generowany OD ZERA
            // przy każdym uruchomieniu (świeża maszyna = nowy losowy klucz
            // za każdym razem). Android traktuje appkę podpisaną innym
            // kluczem jako INNĄ aplikację i blokuje instalację
            // "aktualizacji" — trzeba było odinstalować starą wersję
            // ręcznie (zgłoszone przez Pawła). Plik debug.keystore obok
            // (wygenerowany raz i zacommitowany, patrz
            // .github/workflows/android-debug-apk.yml) ze standardowymi,
            // publicznie znanymi danymi debug-keystore'a Androida — to NIE
            // jest sekret, każda instalacja Android Studio ma taki sam
            // domyślnie.
            if (hasFixedDebugKeystore) {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // Wersje rozdawane testerom (workflow android-debug-apk.yml) podpisujemy PRYWATNYM kluczem
            // wydawniczym, gdy CI go odtworzy z sekretów (keystore.properties). Publiczny debug.keystore
            // z repozytorium zostaje tylko jako zapas dla lokalnych buildów bez klucza: kto zna ten klucz,
            // mógłby wydać podrobioną "aktualizację", która nadpisze prawdziwą aplikację (audyt F16).
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            } else if (hasFixedDebugKeystore) {
                signingConfig signingConfigs.debug
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
