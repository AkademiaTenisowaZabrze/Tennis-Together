name: Build Android APK

# Buduje podpisany plik APK i dołącza go do GitHub Release (historia wersji,
# widoczna dla współpracowników repo — zakładka Releases). Publikację
# publiczną (strona do ściągania APK) dodamy, gdy będzie potrzebna — patrz
# wzorzec w projekcie "NOWA APLIKACJA PZT ANDROID".
#
# Wymaga sekretów (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Dopóki ich nie ma, ten workflow się nie powiedzie — dlatego TYLKO ręczne
# uruchomienie (workflow_dispatch), nie na każdy push. Do szybkich testów
# bez klucza służy android-debug-apk.yml (buduje niepodpisany debug APK).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Java (JDK 21)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Odtwórz google-services.json z sekretu (powiadomienia push)
        # Patrz ten sam krok w android-debug-apk.yml — identyczny powód i
        # ta sama poprawka (secrets niedostępne bezpośrednio w if:).
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Instalacja zależności
        run: npm ci

      - name: Ustal adres strony (działa po przeniesieniu repo na inne konto)
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "SITE_URL=https://${OWNER}.github.io/${REPO}" >> "$GITHUB_ENV"
          echo "PAGES_BASE=/${REPO}/app/" >> "$GITHUB_ENV"

      - name: Build web (Vite)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SITE_URL: ${{ env.SITE_URL }}
          # Ten sam numer co -PappVersionName niżej (Android), żeby wersja
          # widoczna w apce zgadzała się z tym, co Android pokazuje w
          # Ustawieniach przy aplikacji.
          VITE_APP_VERSION: 0.1.${{ github.run_number }}
        run: npm run build

      - name: Sync Capacitor → Android
        run: npx cap sync android

      - name: Odtwórz klucz podpisujący z sekretów
        working-directory: android/app
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > tennis-together-release.keystore
          cat > keystore.properties <<EOF
          storeFile=tennis-together-release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build APK (release, podpisany)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName="0.1.${{ github.run_number }}"

      - name: Nazwij plik z numerem wersji
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             "android/app/build/outputs/apk/release/tennis-together-v${{ github.run_number }}.apk"

      - name: Udostępnij APK (artifact przebiegu)
        uses: actions/upload-artifact@v7
        with:
          name: tennis-together-v${{ github.run_number }}
          path: android/app/build/outputs/apk/release/tennis-together-v${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Dołącz APK do GitHub Release (historia wersji)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ github.run_number }}
          name: "Wersja ${{ github.run_number }}"
          files: android/app/build/outputs/apk/release/tennis-together-v${{ github.run_number }}.apk
          make_latest: true
