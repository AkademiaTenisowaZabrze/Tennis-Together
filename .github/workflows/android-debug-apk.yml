name: Build Android Debug APK

# Szybki build do testowania na własnym telefonie, podpisany STAŁYM
# debug.keystore (patrz android/app/build.gradle i krok "Wygeneruj stały
# debug.keystore" niżej) — nie kluczem produkcyjnym. Nie nadaje się do
# Google Play — tam potrzebny będzie android-build.yml z prawdziwym kluczem
# (patrz PLAN.md).
#
# Buduje się automatycznie po każdym pushu na main (jak w projekcie PZT).
# Wynik trafia w DWA miejsca:
#   - GitHub Release (zakładka "Releases") — stały publiczny link, otwiera
#     się wprost w przeglądarce na telefonie, bez logowania, bez ZIP-a.
#   - artifact przebiegu (zakładka Actions) — wymaga zalogowania do GitHub.
# Da się też uruchomić ręcznie (workflow_dispatch).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Java (JDK 21)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Odtwórz google-services.json z sekretu (powiadomienia push)
        # Plik jest w .gitignore (patrz .gitignore) — identyfikuje projekt
        # Firebase, w publicznym repo trzymamy go poza kodem. Bez niego
        # google-services plugin się nie włączy (patrz warunek w
        # android/app/build.gradle) i APK zbuduje się normalnie, tylko bez
        # działających powiadomień push.
        #
        # UWAGA: `secrets` NIE jest dostępne bezpośrednio w warunku `if:`
        # (błąd "Unrecognized named-value: 'secrets'", złapany na żywo) —
        # trzeba go najpierw przepisać do zmiennej środowiskowej i dopiero
        # w if: odwołać się do `env.*`.
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Odtwórz prywatny klucz podpisujący z sekretów
        # Wersje dla testerów podpisujemy kluczem, którego nie ma w repozytorium (audyt F16).
        # Bez sekretów build wraca do publicznego debug.keystore (tylko do prób).
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/tennis-together-release.keystore
            {
              echo "storeFile=tennis-together-release.keystore"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > android/app/keystore.properties
            echo "Podpisuję prywatnym kluczem wydawniczym."
          else
            echo "Brak sekretów klucza, używam publicznego debug.keystore."
          fi

      - name: Wygeneruj stały debug.keystore (jednorazowo, jeśli brak)
        # Bez tego każdy build CI ma inny, losowo wygenerowany klucz debug
        # (świeża maszyna GitHub Actions za każdym razem) — Android
        # traktuje appkę podpisaną innym kluczem jako inną aplikację i
        # blokuje instalację "aktualizacji" zamiast nadpisać starą wersję.
        # Dane debug-keystore'a są standardowe i publicznie znane (nie
        # sekret), więc bezpiecznie commitujemy go do repo — raz.
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/app/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f android/app/debug.keystore
            git commit -m "Dodaj staly debug.keystore (auto, CI) [skip ci] - bez tego kazdy build CI mial inny losowy klucz debug, Android blokowal instalacje aktualizacji"
            git push
          else
            echo "debug.keystore już istnieje w repo, pomijam."
          fi

      - name: Instalacja zależności
        run: npm ci

      - name: Ustal adres strony (działa po przeniesieniu repo na inne konto)
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "SITE_URL=https://${OWNER}.github.io/${REPO}" >> "$GITHUB_ENV"
          echo "PAGES_BASE=/${REPO}/app/" >> "$GITHUB_ENV"

      - name: Build web (Vite)
        env:
          # Klucz "anon/publishable" jest z definicji publiczny (patrz
          # src/lib/supabase.js) — bezpiecznie trzymać go wprost tutaj,
          # bez sekretu, żeby uruchomienie nie wymagało dodatkowej
          # konfiguracji w repo.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://jrabxtiranllayerhutm.supabase.co' }}
          VITE_SITE_URL: ${{ env.SITE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_8-yxyMhoEEq-kHx2opU0Pg_QylogBur' }}
          # Ten sam numer co -PappVersionName niżej (Android), żeby wersja
          # widoczna w apce (ekran logowania, profil) zgadzała się z tym,
          # co Android pokazuje w Ustawieniach przy aplikacji.
          VITE_APP_VERSION: 0.1.${{ github.run_number }}
        run: npm run build

      - name: Sync Capacitor → Android
        run: npx cap sync android

      - name: Build APK (debug, podpisany kluczem wydawniczym z sekretów)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName="0.1.${{ github.run_number }}"

      - name: Nazwij plik z numerem wersji
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             "android/app/build/outputs/apk/debug/tennis-together-debug-v${{ github.run_number }}.apk"

      - name: Udostępnij APK (artifact przebiegu — wymaga zalogowania do GitHub)
        uses: actions/upload-artifact@v7
        with:
          name: tennis-together-debug-v${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/tennis-together-debug-v${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publikuj APK jako GitHub Release (link bez logowania)
        # Stały, publiczny adres URL do pobrania wprost w przeglądarce na
        # telefonie — bez logowania do GitHub, bez rozpakowywania ZIP-a
        # (w przeciwieństwie do artifactu wyżej). Osobny prefiks tagu
        # "debug-vN" niż w android-build.yml ("vN"), żeby numery przebiegów
        # tych dwóch workflowów nigdy się nie zderzyły.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: debug-v${{ github.run_number }}
          name: "Debug APK #${{ github.run_number }}"
          prerelease: true
          files: android/app/build/outputs/apk/debug/tennis-together-debug-v${{ github.run_number }}.apk

      - name: Skopiuj pod stałą nazwą (dla linku "zawsze najnowszy")
        # Strona dla testerów klubowych linkuje do STAŁEGO adresu, nie do
        # numeru konkretnego buildu, żeby nie trzeba było ręcznie
        # aktualizować linku po każdym pushu. Kopia pod niezmienną nazwą +
        # niezmienny tag release'a (niżej) to załatwia.
        run: |
          cp "android/app/build/outputs/apk/debug/tennis-together-debug-v${{ github.run_number }}.apk" \
             android/app/build/outputs/apk/debug/tennis-together-debug-latest.apk

      - name: Publikuj/zaktualizuj release "zawsze najnowszy" (stały link)
        # Ten sam tag za każdym razem (debug-latest) — action-gh-release
        # aktualizuje istniejący release zamiast tworzyć nowy, więc adres
        # .../releases/download/debug-latest/tennis-together-debug-latest.apk
        # nigdy się nie zmienia, mimo że plik pod spodem jest za każdym razem
        # świeży.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: debug-latest
          name: "Debug APK — zawsze najnowszy (obecnie #${{ github.run_number }})"
          prerelease: true
          body: "Automatycznie aktualizowany po każdym pushu na main. Ten konkretny build to #${{ github.run_number }} (commit ${{ github.sha }})."
          files: android/app/build/outputs/apk/debug/tennis-together-debug-latest.apk
