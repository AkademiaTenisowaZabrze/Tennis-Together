name: Import turniejów Tennis Europe

# Pobiera kalendarz Tennis Europe Junior Tour (te.tournamentsoftware.com,
# cała Europa naraz) i zapisuje/aktualizuje w tabeli `tournaments`.
# Patrz scripts/import_tennis_europe.py.
#
# Wymaga tego samego sekretu co import OTK:
#   SUPABASE_SERVICE_ROLE_KEY
#
# Codziennie o 2:30 UTC (pół godziny po imporcie OTK, żeby nie nakładały
# się w czasie) + ręcznie z zakładki Actions.

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja zależności
        run: pip install -r scripts/requirements.txt

      - name: Import turniejów Tennis Europe
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://jrabxtiranllayerhutm.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/import_tennis_europe.py
