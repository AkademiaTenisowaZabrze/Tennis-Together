<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Potwierdzenie e-maila — Tennis Together</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500&display=swap');
  :root {
    --bg: #0d131e;
    --card: rgba(22, 32, 50, 0.72);
    --card-border: rgba(255, 255, 255, 0.09);
    --text: #f4f6fb;
    --text-muted: #9aa5b8;
    --primary: #d4ff00;
    --primary-text: #0d131e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 380px;
    width: 100%;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 36px 28px;
  }
  .icon { font-size: 48px; margin-bottom: 8px; }
  h1 {
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    font-size: 22px;
    margin: 0 0 10px;
  }
  p { margin: 0 0 8px; color: var(--text-muted); font-size: 14px; line-height: 1.5; }
  .hint {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--card-border);
    font-size: 13px;
  }
  .hint p { margin: 0; }
</style>
</head>
<body>
  <div class="card" id="card">
    <!-- Wypełniane przez skrypt niżej na podstawie tego, co Supabase dopisze
         do adresu po powrocie z weryfikacji (#access_token=... przy
         sukcesie, #error=...&error_code=...&error_description=... przy
         błędzie — np. wygasły lub już wykorzystany link). Bez JS-a (np.
         wyłączony w przeglądarce) pokazuje się neutralny stan domyślny
         poniżej. -->
    <div class="icon">🎾✅</div>
    <h1>Super, że do nas dołączyłeś!</h1>
    <p>Twoje konto w Tennis Together jest aktywne. Możesz wrócić do aplikacji i się zalogować.</p>
    <div class="hint">
      <p>Ten ekran możesz teraz zamknąć — logowanie odbywa się w samej aplikacji na telefonie, nie tutaj.</p>
    </div>
  </div>

  <script>
    // Supabase po weryfikacji linku z maila dopisuje wynik do fragmentu
    // adresu (#...), nie do samej treści strony — trzeba go odczytać w JS.
    // Rozróżniamy sukces / błąd / brak parametrów (np. ktoś wszedł na tę
    // stronę wprost, bez klikania linku z maila), zamiast zawsze pokazywać
    // to samo "potwierdzone", niezależnie co faktycznie się stało.
    (function () {
      var params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      var card = document.getElementById("card");
      var error = params.get("error_description") || params.get("error");
      var hasToken = params.get("access_token");

      function render(icon, title, text, hintText) {
        card.innerHTML =
          '<div class="icon">' + icon + '</div>' +
          "<h1>" + title + "</h1>" +
          "<p>" + text + "</p>" +
          '<div class="hint"><p>' + hintText + "</p></div>";
      }

      if (error) {
        var code = params.get("error_code") || "";
        var friendly =
          code.indexOf("expired") !== -1
            ? "Ten link wygasł — linki potwierdzające są ważne tylko przez jakiś czas."
            : code.indexOf("already") !== -1
            ? "Ten e-mail został już wcześniej potwierdzony."
            : "Ten link jest nieprawidłowy — mógł już zostać użyty, albo wygasł.";
        render(
          "🎾",
          "Ups, coś poszło nie tak",
          friendly,
          "Wróć do aplikacji i spróbuj się zalogować — jeśli to nie zadziała, załóż konto jeszcze raz, żeby dostać nowy link."
        );
      } else if (hasToken) {
        // Domyślna treść w HTML wyżej już pokazuje wariant sukcesu —
        // nic nie trzeba zmieniać, zostawiamy jak jest.
      } else {
        // Strona otwarta bez żadnych parametrów w adresie — nie wiadomo,
        // czy potwierdzenie faktycznie się powiodło (np. ktoś wkleił sam
        // adres bez reszty linku).
        render(
          "🎾",
          "Tennis Together",
          "Ta strona pojawia się po kliknięciu linku potwierdzającego z maila.",
          "Jeśli szukasz potwierdzenia e-maila, sprawdź skrzynkę i kliknij link z wiadomości od nas."
        );
      }
    })();
  </script>
</body>
</html>
